<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Tramuntana, oil on linen">
  <defs>
    <linearGradient id="linen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe0c6"/>
      <stop offset="0.42" stop-color="#e8c9a6"/>
      <stop offset="0.62" stop-color="#c9a789"/>
      <stop offset="1" stop-color="#8c6a53"/>
    </linearGradient>
    <linearGradient id="deepSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d6c93"/>
      <stop offset="0.45" stop-color="#1f4467"/>
      <stop offset="1" stop-color="#122739"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d08a5c"/>
      <stop offset="0.55" stop-color="#a75f3a"/>
      <stop offset="1" stop-color="#6f3a25"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d2" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#f8d79c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f8d79c" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75 0.9" numOctaves="4" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22" intercept="0"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <!-- the linen, warm and uneven -->
  <rect width="600" height="600" fill="url(#linen)"/>
  <ellipse cx="250" cy="180" rx="280" ry="200" fill="#f7e6c6" opacity="0.55" filter="url(#softer)"/>
  <circle cx="404" cy="168" r="96" fill="url(#sun)"/>

  <!-- the sea, laid in horizontal strokes of deepening blue -->
  <g stroke-linecap="round">
    <path d="M0 336 H600" stroke="#7fa9c7" stroke-width="46" opacity="0.65"/>
    <path d="M0 372 H600" stroke="#5b8bab" stroke-width="40" opacity="0.7"/>
    <path d="M0 406 H600" stroke="#3a6a90" stroke-width="38" opacity="0.75"/>
    <path d="M0 444 H600" stroke="#275277" stroke-width="40" opacity="0.8"/>
    <path d="M0 486 H600" stroke="#1b3f5f" stroke-width="44" opacity="0.85"/>
    <path d="M0 534 H600" stroke="#122c44" stroke-width="46" opacity="0.9"/>
    <path d="M0 580 H600" stroke="#0d2033" stroke-width="46"/>
  </g>
  <g stroke-linecap="round" opacity="0.55">
    <path d="M60 352 H250" stroke="#dceaf3" stroke-width="6"/>
    <path d="M300 386 H540" stroke="#bcd6e6" stroke-width="7"/>
    <path d="M120 424 H330" stroke="#9dc0d6" stroke-width="5"/>
    <path d="M360 470 H590" stroke="#7ba3bf" stroke-width="6"/>
  </g>

  <!-- the cliff, palette knife, warm against the blue -->
  <path d="M0 600 L0 196 L74 176 L132 232 L186 208 L246 262 L300 246 L300 600 Z" fill="url(#rock)"/>
  <path d="M0 268 L96 240 L168 282 L240 258 L300 292 L300 356 L0 356 Z" fill="#e0a173" opacity="0.6" filter="url(#soft)"/>
  <g stroke-linecap="round" opacity="0.45">
    <path d="M18 330 L160 300" stroke="#ffd9ae" stroke-width="13"/>
    <path d="M44 386 L210 352" stroke="#b66240" stroke-width="16"/>
    <path d="M10 448 L180 412" stroke="#7d3f27" stroke-width="18"/>
    <path d="M36 512 L220 470" stroke="#5f2f1d" stroke-width="20"/>
    <path d="M0 566 L200 528" stroke="#3f2013" stroke-width="22"/>
  </g>
  <path d="M0 196 L74 176 L132 232 L186 208 L246 262 L300 246" fill="none" stroke="#f4cfa4" stroke-width="7" opacity="0.7"/>

  <!-- light in the sky -->
  <g stroke-linecap="round" opacity="0.5" filter="url(#soft)">
    <path d="M120 120 L420 96" stroke="#fff6df" stroke-width="26"/>
    <path d="M170 158 L470 134" stroke="#f7d7a8" stroke-width="20"/>
    <path d="M240 88 L520 72" stroke="#f3c9a1" stroke-width="18"/>
  </g>

  <!-- canvas weave and a soft edge -->
  <rect width="600" height="600" filter="url(#grain)" opacity="0.45"/>
  <rect x="6" y="6" width="588" height="588" fill="none" stroke="#00000022" stroke-width="12"/>
</svg>
