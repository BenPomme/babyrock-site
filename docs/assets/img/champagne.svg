<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" role="img" aria-label="Bottle of champagne">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d2a1c"/>
      <stop offset="0.22" stop-color="#1f5a3a"/>
      <stop offset="0.5" stop-color="#123d28"/>
      <stop offset="0.78" stop-color="#1c5236"/>
      <stop offset="1" stop-color="#0a2116"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a1f"/>
      <stop offset="0.35" stop-color="#f2d888"/>
      <stop offset="0.6" stop-color="#c9a445"/>
      <stop offset="1" stop-color="#7d5f18"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f1e4"/>
      <stop offset="1" stop-color="#e2d9c3"/>
    </linearGradient>
  </defs>

  <!-- neck and body -->
  <path d="M138 8 h44 v44 c0 14 6 22 12 34 12 22 20 46 20 78 v392 c0 18 -12 30 -30 30 h-48 c-18 0 -30 -12 -30 -30 V164 c0 -32 8 -56 20 -78 6 -12 12 -20 12 -34 Z" fill="url(#glass)"/>
  <!-- foil -->
  <path d="M136 8 h48 v52 c0 12 -4 20 -10 28 h-28 c-6 -8 -10 -16 -10 -28 Z" fill="url(#foil)"/>
  <rect x="134" y="60" width="52" height="10" rx="4" fill="#a5822c" opacity="0.85"/>
  <!-- label -->
  <rect x="94" y="300" width="132" height="150" rx="8" fill="url(#label)"/>
  <rect x="102" y="308" width="116" height="134" rx="6" fill="none" stroke="#b39247" stroke-width="2"/>
  <text x="160" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="2" fill="#2a2a22">CHAMPAGNE</text>
  <text x="160" y="382" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="4" fill="#6b6247">BRUT</text>
  <line x1="118" y1="398" x2="202" y2="398" stroke="#b39247" stroke-width="1.5"/>
  <text x="160" y="424" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="1" fill="#6b6247">CUVÉE 2026</text>
  <!-- glass shine -->
  <rect x="112" y="120" width="26" height="440" rx="13" fill="url(#shine)" opacity="0.6"/>
  <rect x="196" y="140" width="12" height="400" rx="6" fill="#ffffff" opacity="0.10"/>
</svg>
