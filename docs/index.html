<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BabyRock Social</title>
<link rel="canonical" href="https://www.babyrock.ai/es/">
<link rel="alternate" hreflang="es" href="https://www.babyrock.ai/es/">
<link rel="alternate" hreflang="ca" href="https://www.babyrock.ai/ca/">
<link rel="alternate" hreflang="fr" href="https://www.babyrock.ai/fr/">
<link rel="alternate" hreflang="en" href="https://www.babyrock.ai/en/">
<link rel="alternate" hreflang="x-default" href="https://www.babyrock.ai/es/">
<script>
(function () {
  var supported = { es: 1, ca: 1, fr: 1, en: 1 };
  function stored() {
    try {
      var saved = localStorage.getItem("brmsocial.lang");
      return saved && supported[saved] ? saved : null;
    } catch (e) {
      return null;
    }
  }
  function fromBrowser() {
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
    for (var i = 0; i < list.length; i++) {
      var code = String(list[i] || "").toLowerCase().split("-")[0];
      if (supported[code]) return code;
    }
    return null;
  }
  location.replace("/" + (stored() || fromBrowser() || "es") + "/");
})();
</script>
</head>
<body>
<p><a href="/es/">ES</a> · <a href="/ca/">CA</a> · <a href="/fr/">FR</a> · <a href="/en/">EN</a></p>
</body>
</html>
